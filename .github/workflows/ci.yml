name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma versión mayor que producción (PostgreSQL 16 autoalojado, DEC-21) con pgvector.
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOTCENTRO_TEST_PG_HOST: localhost
      BOTCENTRO_TEST_PG_PORT: "5432"
      BOTCENTRO_TEST_PG_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
